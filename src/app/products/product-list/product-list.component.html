<main class="product-page" id="main-content">
  <cx-hero
    eyebrow="THE SERVICE DIRECTORY"
    title="Find the right capability"
    subtitle="Compare development, quality engineering, AI evaluation and training. Open a service for scope and deliverables, then discuss the fit for your project."
    [compact]="true"
    primaryLabel="Start a conversation"
    primaryLink="/agency/schedule"
    secondaryLabel="How we work"
    secondaryLink="/agency/about"
    [stats]="heroStats">
  </cx-hero>

  <div class="user-header" *ngIf="userLabel">
    <div>
      <p class="welcome-kicker">Welcome,</p>
      <h2>{{ userLabel }}</h2>
    </div>
    <div class="user-avatar" role="img" [attr.aria-label]="'Profile of ' + userLabel">{{ userLabel.charAt(0).toUpperCase() }}</div>
  </div>

  <!-- Unified filters: search + practice now, stages behind disclosure -->
  <cx-filter-bar
    *ngIf="!loading && products.length"
    [groups]="sectorGroups"
    [collapsibleGroups]="advancedGroups"
    [selection]="selection"
    [search]="search"
    [searchable]="true"
    [sort]="sort"
    [sortOptions]="sortOptions"
    [resultCount]="filteredProducts.length"
    (selectionChange)="onSelectionChange($event)"
    (searchChange)="search = $event"
    (sortChange)="onSort($event)">
  </cx-filter-bar>

  <h2 class="catalog-heading" *ngIf="!loading && products.length">Available services</h2>

  <!-- Skeleton -->
  <div class="service-list" *ngIf="loading" aria-busy="true" aria-label="Loading services">
    <div class="service-card skeleton" *ngFor="let _ of skeletonItems">
      <div class="skeleton-block icon"></div>
      <div class="skeleton-info">
        <div class="skeleton-block line w60"></div>
        <div class="skeleton-block line w90"></div>
        <div class="skeleton-block line w40"></div>
      </div>
    </div>
  </div>

  <!-- Error state -->
  <cx-empty-state
    *ngIf="!loading && loadError"
    [message]="loadError"
    actionLabel="Retry"
    (action)="retry()">
  </cx-empty-state>

  <!-- Empty state -->
  <cx-empty-state
    *ngIf="!loading && !loadError && filteredProducts.length === 0"
    message="No services match these filters."
    actionLabel="Clear filters"
    (action)="clearFilters()">
  </cx-empty-state>

  <!-- Service cards -->
  <div class="service-list" *ngIf="!loading && filteredProducts.length" aria-label="Available services">
    <cx-card
      *ngFor="let service of filteredProducts"
      variant="service"
      [eyebrow]="service.group"
      [badge]="service.sectorLabel"
      [title]="service.title"
      [description]="service.description"
      [tags]="service.tags ?? []"
      [priceLabel]="priceLabel(service)"
      [sector]="service.sector"
      [detailLink]="serviceLink(service)"
      actionLabel="Shortlist"
      [actionAriaLabel]="'Add ' + service.title + ' to shortlist'"
      (action)="onAddToCart(service)">
    </cx-card>
  </div>

  <cx-cta-section
    title="Not sure where to start?"
    message="Share the outcome you need and the constraints that matter. You can contact Certare without registering."
    primaryLabel="Start a conversation"
    primaryLink="/agency/schedule"
    secondaryLabel="How we work"
    secondaryLink="/agency/about">
  </cx-cta-section>

  <!-- Snackbar -->
  <div class="snackbar" *ngIf="snackbarVisible" role="status">
    <span>{{ snackbarMessage }}</span>
    <button id="snackbar-undo" (click)="undoLast()">Undo</button>
  </div>
</main>
