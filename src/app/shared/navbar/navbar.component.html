<header class="app-bar" *ngIf="!onAuth">
  <div class="app-bar-inner">
    <a class="navbar-brand" routerLink="/" aria-label="Certare home">
      <span class="brand-mark" aria-hidden="true">C<span class="brand-dot"></span></span>
      <span class="brand-text">{{ "Certare" | tr }}</span>
    </a>

    <nav id="primary-navigation" class="nav-links" aria-label="Primary">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" ariaCurrentWhenActive="page">{{ "Home" | tr }}</a>
      <a routerLink="/products/list" routerLinkActive="active" ariaCurrentWhenActive="page">{{ "Services" | tr }}</a>
      <a routerLink="/agency/about" routerLinkActive="active" ariaCurrentWhenActive="page">{{ "Agency" | tr }}</a>
      <a *ngIf="isLoggedIn" routerLink="/sales/history" routerLinkActive="active" ariaCurrentWhenActive="page">{{ "My requests" | tr }}</a>
      <a class="nav-cta" routerLink="/agency/schedule" routerLinkActive="current" ariaCurrentWhenActive="page">{{ "Start a conversation" | tr }}</a>
    </nav>

    <div class="app-bar-right">
      <div class="language-switch" role="group" aria-label="Language / Idioma">
        <button type="button" (click)="language.setLanguage('es')" [class.active]="language.language === 'es'" [attr.aria-pressed]="language.language === 'es'" aria-label="Español">ES</button>
        <button type="button" (click)="language.setLanguage('en')" [class.active]="language.language === 'en'" [attr.aria-pressed]="language.language === 'en'" aria-label="English">EN</button>
      </div>
      <ng-container *ngIf="hasCheckedLogin && isLoggedIn">
        <div class="avatar-menu">
          <button class="avatar-btn" (click)="toggleMenu()" aria-label="Account menu" aria-controls="account-menu" aria-haspopup="true" [attr.aria-expanded]="menuOpen">
            {{ initials }}
          </button>
          <ul id="account-menu" class="menu" [class.open]="menuOpen">
            <li><button type="button" class="menu-link" (click)="logout()">{{ "Log Out" | tr }}</button></li>
          </ul>
        </div>
      </ng-container>
    </div>
  </div>
</header>

<!-- Mobile: one navigation, at the bottom. -->
<nav class="bottom-nav" *ngIf="!onAuth" aria-label="Bottom">
  <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" ariaCurrentWhenActive="page">
    <span class="nav-icon">
      <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
    </span>
    {{ "Home" | tr }}
  </a>
  <a routerLink="/products/list" routerLinkActive="active" ariaCurrentWhenActive="page">
    <span class="nav-icon">
      <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h10"/></svg>
    </span>
    {{ "Services" | tr }}
  </a>
  <a routerLink="/agency/about" routerLinkActive="active" ariaCurrentWhenActive="page">
    <span class="nav-icon"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg></span>
    {{ "Agency" | tr }}
  </a>
  <a routerLink="/agency/schedule" routerLinkActive="active" ariaCurrentWhenActive="page">
    <span class="nav-icon">
      <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>
    </span>
    {{ "Contact" | tr }}
  </a>
</nav>

<div *ngIf="onAuth" class="auth-language language-switch" role="group" aria-label="Language / Idioma">
  <button type="button" (click)="language.setLanguage('es')" [class.active]="language.language === 'es'" [attr.aria-pressed]="language.language === 'es'" aria-label="Español">ES</button>
  <button type="button" (click)="language.setLanguage('en')" [class.active]="language.language === 'en'" [attr.aria-pressed]="language.language === 'en'" aria-label="English">EN</button>
</div>
