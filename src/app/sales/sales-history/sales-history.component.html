<div class="cart-page">
  <header class="page-head">
    <span class="head-chip">FOLLOW-UP</span>
    <h1>My Requests</h1>
    <p class="cart-sub">Discovery calls you requested and their status. We reply within one business day.</p>
  </header>

  <div class="cart-empty" *ngIf="loading" aria-busy="true">
    <p>Loading your requests…</p>
  </div>

  <cx-empty-state
    *ngIf="!loading && loadError"
    [message]="loadError">
  </cx-empty-state>

  <cx-empty-state
    *ngIf="!loading && !loadError && requests.length === 0"
    message="No requests yet."
    actionLabel="Schedule your first call"
    (action)="goSchedule()">
  </cx-empty-state>

  <section class="cart-items" *ngIf="!loading && requests.length" aria-label="My requests">
    <div class="cart-card" *ngFor="let req of requests">
      <div class="item-info">
        <h2 class="item-title">{{ req.message | slice:0:80 }}{{ req.message.length > 80 ? '…' : '' }}</h2>
        <span class="unit-price">{{ req.name }} · {{ req.email }}</span>
      </div>
      <div class="item-total">{{ req.status | uppercase }}</div>
    </div>
  </section>
</div>
